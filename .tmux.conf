# ==========================================
# Modern Browser-Style Clickable Tabs for tmux
# ==========================================

# UTF-8 & 256 Color Terminal Support
set -g default-terminal "screen-256color"

# 1. Enable full mouse support (click tabs, resize panes, scroll)
set -g mouse on
set -g set-clipboard on

# 2. Position status bar at the top (like browser tabs)
set -g status-position top
set -g status-justify left

# 3. Start window and pane indexing at 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# 4. Color theme (Modern Dark / Catppuccin inspired)
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

# Inherit clean dark background for main shell window
set -g window-style "bg=default,fg=default"
set -g window-active-style "bg=default,fg=default"

# Allow up to 50 characters for status-left so all GUI buttons fit
set -g status-left-length 50

# Allow applications (like gemini, agy, or shell scripts) to set tab title live
set -g allow-rename on
setw -g automatic-rename on

# Smart AI Agent & Clean Path formatting (~ for home directory, 🤖 for gemini/agy AI agents)
setw -g automatic-rename-format '#{?#{!=:#{pane_title},#{host_short}},#{pane_title},#{?#{==:#{pane_current_command},zsh},📁 #{?#{==:#{pane_current_path},/Users/sampomerantz},~,#{b:pane_current_path}},#{?#{||:#{==:#{pane_current_command},gemini},#{==:#{pane_current_command},agy}},🤖 #{pane_current_command}: #{?#{==:#{pane_current_path},/Users/sampomerantz},~,#{b:pane_current_path}},⚡ #{pane_current_command}}}}'

# ==========================================
# Sleek Clickable GUI Toolbar (Top-Left)
# ==========================================
# [+] New Tab | [-] Smart Close | [◧] Split Vert | [⬒] Split Horiz | [⛶] Zoom | [🚪] Detach | [🔍] Search All | [↕] Scroll
set -g status-left "#[bg=#313244,fg=#a6e3a1,bold] + #[fg=#45475a]│#[fg=#f38ba8] - #[fg=#45475a]│#[fg=#89b4fa] ◧ #[fg=#45475a]│#[fg=#cba6f7] ⬒ #[fg=#45475a]│#[fg=#f9e2af] ⛶ #[fg=#45475a]│#[fg=#fab387] 🚪 #[fg=#45475a]│#[fg=#89dceb] 🔍 #[fg=#45475a]│#[fg=#94e2d5] ↕ #[default] "

# Clean shell dispatcher for mouse clicks on top-left toolbar
bind -n MouseDown1StatusLeft run-shell ' \
  x=#{mouse_x}; \
  if [ "$x" -lt 4 ]; then \
    tmux new-window -c "#{pane_current_path}"; \
  elif [ "$x" -lt 8 ]; then \
    panes=$(tmux display-message -p "#{window_panes}"); \
    wins=$(tmux display-message -p "#{session_windows}"); \
    if [ "$panes" -gt 1 ]; then \
      tmux kill-pane; \
    elif [ "$wins" -gt 1 ]; then \
      tmux kill-window; \
    else \
      tmux kill-session; \
    fi; \
  elif [ "$x" -lt 12 ]; then \
    tmux split-window -h -c "#{pane_current_path}"; \
  elif [ "$x" -lt 16 ]; then \
    tmux split-window -v -c "#{pane_current_path}"; \
  elif [ "$x" -lt 20 ]; then \
    tmux resize-pane -Z; \
  elif [ "$x" -lt 25 ]; then \
    tmux detach-client; \
  elif [ "$x" -lt 30 ]; then \
    tmux command-prompt -p "Search All Tabs:" "find-window -C -N '\''%%'\''"; \
  else \
    if [ "#{pane_in_mode}" -eq 1 ]; then \
      tmux send-keys -X cancel; \
    else \
      tmux copy-mode; \
    fi; \
  fi \
'

# Inactive Tab styling
setw -g window-status-style "bg=#313244,fg=#a6adc8"
setw -g window-status-format "  #I: #W  "

# Active Tab styling (Highlighted like an active browser tab)
setw -g window-status-current-style "bg=#89b4fa,fg=#11111b,bold"
setw -g window-status-current-format "  #I: #W  "

# Tab separator spacing
setw -g window-status-separator " "

# Right side status bar (Time & Date)
set -g status-right "#[fg=#89b4fa,bg=#1e1e2e] %H:%M  "

# ==========================================
# Keyboard Shortcuts & Global Tab Search
# ==========================================

# Ctrl-b Shift-S -> Search across ALL tabs (Content & Name)
bind S command-prompt -p "Search All Tabs:" "find-window -C -N '%%'"

# Direct Search Shortcut: Ctrl-b / -> Search current tab
bind / copy-mode \; send-keys ?

# Ctrl-b f -> Clean 1-line Tab List
bind f choose-window

# Split side-by-side with Ctrl-b |
bind | split-window -h -c "#{pane_current_path}"

# Split top/bottom with Ctrl-b -
bind - split-window -v -c "#{pane_current_path}"

# Keep current working directory when opening new tab
bind c new-window -c "#{pane_current_path}"

# Unbind defaults % and "
unbind '"'
unbind %
