# ==========================================
# Modern Browser-Style Clickable Tabs for tmux
# ==========================================

# UTF-8 & 256 Color Terminal Support
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ',*:UTF-8'

# 1. Enable full mouse support (click tabs, resize panes, scroll)
set -g mouse on
set -g set-clipboard on

# 2. Position status bar at the top (like browser tabs)
set -g status-position top
set -g status-justify left

# 3. Start window and pane indexing at 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# 4. Color theme (Modern Dark / Catppuccin inspired)
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

# Allow up to 45 characters for status-left so all GUI buttons fit
set -g status-left-length 45

# ==========================================
# Sleek Clickable GUI Toolbar (Top-Left)
# ==========================================
# [+] New Tab | [✕] Close Tab | [◧] Split Vert | [⬒] Split Horiz | [✕] Close Pane | [⛶] Zoom | [↕] Scroll
set -g status-left "#[bg=#313244,fg=#a6e3a1,bold] + #[fg=#45475a]│#[fg=#f38ba8] ✕ #[fg=#45475a]│#[fg=#89b4fa] ◧ #[fg=#45475a]│#[fg=#cba6f7] ⬒ #[fg=#45475a]│#[fg=#f38ba8] ✕ #[fg=#45475a]│#[fg=#f9e2af] ⛶ #[fg=#45475a]│#[fg=#94e2d5] ↕ #[default] "

# Clean shell dispatcher for mouse clicks on top-left toolbar
bind -n MouseDown1StatusLeft run-shell ' \
  x=#{mouse_x}; \
  if [ "$x" -lt 4 ]; then \
    tmux new-window -c "#{pane_current_path}"; \
  elif [ "$x" -lt 8 ]; then \
    tmux kill-window; \
  elif [ "$x" -lt 12 ]; then \
    tmux split-window -h -c "#{pane_current_path}"; \
  elif [ "$x" -lt 16 ]; then \
    tmux split-window -v -c "#{pane_current_path}"; \
  elif [ "$x" -lt 20 ]; then \
    tmux kill-pane; \
  elif [ "$x" -lt 24 ]; then \
    tmux resize-pane -Z; \
  else \
    if [ "#{pane_in_mode}" -eq 1 ]; then \
      tmux send-keys -X cancel; \
    else \
      tmux copy-mode; \
    fi; \
  fi \
'

# Inactive Tab styling
setw -g window-status-style "bg=#313244,fg=#a6adc8"
setw -g window-status-format "  #I: #W  "

# Active Tab styling (Highlighted like an active browser tab)
setw -g window-status-current-style "bg=#89b4fa,fg=#11111b,bold"
setw -g window-status-current-format "  #I: #W  "

# Tab separator spacing
setw -g window-status-separator " "

# Right side status bar (Time & Date)
set -g status-right "#[fg=#89b4fa,bg=#1e1e2e] %H:%M  "

# 5. Enable automatic window titles based on current running command
setw -g automatic-rename on

# ==========================================
# Keyboard Shortcuts
# ==========================================

# Split side-by-side with Ctrl-b |
bind | split-window -h -c "#{pane_current_path}"

# Split top/bottom with Ctrl-b -
bind - split-window -v -c "#{pane_current_path}"

# Keep current working directory when opening new tab
bind c new-window -c "#{pane_current_path}"

# Unbind defaults % and "
unbind '"'
unbind %
